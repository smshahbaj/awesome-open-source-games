<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Open Source Games</title>
  <desc id="desc">Discover, learn from, and build with open-source games and game-development projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset=".55" stop-color="#11111a"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".35"/></filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <circle cx="150" cy="80" r="100" fill="#8b5cf6" opacity=".16" filter="url(#blur)">
    <animate attributeName="cx" values="150;1040;150" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="290" r="90" fill="#06b6d4" opacity=".13" filter="url(#blur)">
    <animate attributeName="cy" values="290;70;290" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".18" stroke="#fff">
    <path d="M0 310L280 30M150 360L430 80M820 360L1140 40M980 360L1200 140" stroke-width="1"/>
  </g>

  <g transform="translate(72 98)" filter="url(#shadow)">
    <rect width="150" height="150" rx="38" fill="#0d0d13" stroke="#2b2b38" stroke-width="2"/>
    <rect x="22" y="22" width="106" height="106" rx="28" fill="#11111a"/>
    <path d="M53 75h44M75 53v44" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="104" cy="59" r="7" fill="#22d3ee"/>
    <circle cx="91" cy="75" r="7" fill="#a78bfa"/>
    <circle cx="104" cy="91" r="7" fill="#60a5fa"/>
  </g>

  <text x="270" y="140" fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">
    Awesome Open Source Games
  </text>
  <text x="273" y="188" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="23">
    Discover • Learn • Build • Share
  </text>
  <rect x="273" y="218" width="390" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="90;390;90" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="273" y="265" fill="#71717a" font-family="Arial, Helvetica, sans-serif" font-size="17">
    A quality-first curated collection by SM Shahbaj
  </text>
  <text x="273" y="292" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="14">
    Open-source games · engines · tools · learning
  </text>
</svg>