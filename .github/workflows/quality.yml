name: Repository quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config .lychee.toml '**/*.md' '**/*.html'
          fail: true

  catalogue:
    name: Catalogue consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate catalogue
        run: python3 scripts/validate_catalogue.py
